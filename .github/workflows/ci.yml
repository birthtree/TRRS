name: CI Pipeline

on:
  push:
    branches:
      - lab2

jobs:
  RunMake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y build-essential dpkg

      - name: Run Make
        run: |
          cd src
          g++ -Wall -Wextra -O2 Fibi.cpp -o fibonacci || { echo "Compilation failed"; exit 1; }
          ls -l  # Проверяем, что файл fibonacci существует в папке src
          mkdir -p ../artifacts
          cp src/fibonacci ../usr/bin/ || { echo "Failed to copy fibonacci to /usr/bin"; exit 1; }
          rm -f src/fibonacci || { echo "Failed to remove fibonacci from src"; exit 1; }

      - name: Upload Artifact (Binary)
        uses: actions/upload-artifact@v4
        with:
          name: fibonacci-binary
          path: artifacts/

  RunTest:
    needs: RunMake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: fibonacci-binary
          path: artifacts/

      - name: Run Tests
        run: |
          chmod +x artifacts/fibonacci
          echo "Running fibonacci with argument 5"
          ./artifacts/fibonacci 5
          echo "Running fibonacci with argument 1"
          ./artifacts/fibonacci 1
          echo "Running fibonacci with argument 20"
          ./artifacts/fibonacci 20

  RunPackage:
    needs: RunTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: fibonacci-binary
          path: artifacts/

      - name: Create Debian Package
        run: |
          mkdir -p artifacts/deb/usr/local/bin
          mkdir -p artifacts/deb/DEBIAN
          cp DEBIAN/control artifacts/deb/DEBIAN/
          cp /usr/bin/fibonacci artifacts/deb/usr/local/bin/  # Используем путь /usr/bin/fibonacci
          dpkg-deb --build artifacts/deb fibonacci.deb

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: fibonacci-deb
          path: fibonacci.deb
