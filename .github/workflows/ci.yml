name: CI Pipeline

on:
  push:
    branches:
      - lab3

jobs:
  RunMake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential dpkg cmake git zlib1g-dev libcurl4-openssl-dev pkg-config

      - name: Install Prometheus C++ Client
        run: |
          git clone --recursive https://github.com/jupp0r/prometheus-cpp.git
          cd prometheus-cpp
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=ON
          make -j$(nproc)
          sudo make install
          # Обновляем кэш библиотек
          sudo ldconfig
          # Устанавливаем путь к библиотекам
          echo "/usr/local/lib" | sudo tee -a /etc/ld.so.conf.d/prometheus-cpp.conf
          sudo ldconfig

      - name: Run Make
        run: |
          cd src
          # Используем pkg-config для поиска библиотеки
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig pkg-config --cflags --libs prometheus-cpp
          make || { echo "Make failed"; exit 1; }
          ls -l
          mkdir -p ../artifacts
          cp fibonacci ../artifacts/ || { echo "Failed to copy fibonacci to artifacts"; exit 1; }

      - name: Upload Artifact (Binary)
        uses: actions/upload-artifact@v4
        with:
          name: fibonacci-binary
          path: artifacts/

  RunPackage:
    needs: RunMake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: fibonacci-binary
          path: artifacts/

      - name: Create Debian Package
        run: |
          mkdir -p artifacts/deb/usr/local/bin
          mkdir -p artifacts/deb/DEBIAN
          cp DEBIAN/control artifacts/deb/DEBIAN/
          cp artifacts/fibonacci artifacts/deb/usr/local/bin/
          dpkg-deb --build artifacts/deb fibonacci.deb

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: fibonacci-deb
          path: fibonacci.deb

  RunDeploy:
    needs: RunPackage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Debian Package
        uses: actions/download-artifact@v4
        with:
          name: fibonacci-deb
          path: ./ 

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: birthtree/fibonacci:latest

      - name: Run Container
        run: |
          docker run --rm birthtree/fibonacci
