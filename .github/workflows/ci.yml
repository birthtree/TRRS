name: CI Pipeline

on:
  push:
    branches:
      - lab3

jobs:
  RunMake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential dpkg cmake git zlib1g-dev libcurl4-openssl-dev pkg-config

      - name: Install Prometheus C++ Client
        run: |
          git clone --recursive https://github.com/jupp0r/prometheus-cpp.git
          cd prometheus-cpp
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=ON
          make -j$(nproc)
          sudo make install
          # Устанавливаем путь к библиотекам
          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          # Проверяем наличие prometheus-cpp.pc
          find /usr/local/lib/pkgconfig -name prometheus-cpp.pc || echo "prometheus-cpp.pc not found"

      - name: Set PKG_CONFIG_PATH
        run: |
          # Устанавливаем PKG_CONFIG_PATH для поиска .pc файлов
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
          echo "PKG_CONFIG_PATH is set to $PKG_CONFIG_PATH"
          # Проверка с использованием pkg-config
          pkg-config --cflags --libs prometheus-cpp || echo "prometheus-cpp not found"

      - name: Run Make (use pkg-config if available)
        run: |
          cd src
          # Пробуем использовать pkg-config, если он доступен, или вручную указываем путь
          if command -v pkg-config &> /dev/null
          then
            g++ $(pkg-config --cflags --libs prometheus-cpp) -Wall -Wextra -O2 -std=c++11 Fibi.cpp -o fibonacci
          else
            echo "pkg-config not found, using manual flags"
            # Указываем путь к библиотеке явно
            g++ -Wall -Wextra -O2 -std=c++11 Fibi.cpp -o fibonacci -L/usr/local/lib -lprometheus-cpp
          fi
          make || { echo "Make failed"; exit 1; }
          ls -l
          mkdir -p ../artifacts
          cp fibonacci ../artifacts/ || { echo "Failed to copy fibonacci to artifacts"; exit 1; }

      - name: Upload Artifact (Binary)
        uses: actions/upload-artifact@v4
        with:
          name: fibonacci-binary
          path: artifacts/

  RunPackage:
    needs: RunMake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: fibonacci-binary
          path: artifacts/

      - name: Create Debian Package
        run: |
          mkdir -p artifacts/deb/usr/local/bin
          mkdir -p artifacts/deb/DEBIAN
          cp DEBIAN/control artifacts/deb/DEBIAN/
          cp artifacts/fibonacci artifacts/deb/usr/local/bin/
          dpkg-deb --build artifacts/deb fibonacci.deb

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: fibonacci-deb
          path: fibonacci.deb

  RunDeploy:
    needs: RunPackage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Debian Package
        uses: actions/download-artifact@v4
        with:
          name: fibonacci-deb
          path: ./ 

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: birthtree/fibonacci:latest

      - name: Run Container
        run: |
          docker run --rm birthtree/fibonacci
